<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Products</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>Product Management</h1>


    <!-- Add Product -->

    <div class="form-box">

        <h2>Add Product</h2>

        <form id="productForm">

            <input
                type="text"
                id="name"
                placeholder="Product Name"
                required>

            <input
                type="text"
                id="category"
                placeholder="Category"
                required>

            <button type="submit">
                Add Product
            </button>

        </form>

    </div>


    <hr>


    <!-- Product List -->

    <h2>Product List</h2>

    <table
        border="1"
        width="100%"
        id="productTable">

        <thead>

            <tr>

                <th>ID</th>

                <th>Name</th>

                <th>Category</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="productTableBody">

        </tbody>

    </table>

</div>


<script src="products.js"></script>

</body>

</html>
